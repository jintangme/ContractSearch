spring:
  application.name: smart-contract-search-engine
  # PostgreSQL / ParadeDB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${POSTGRESQL_DB_USERNAME:myuser}          # 配置环境变量
    password: ${POSTGRESQL_DB_PASSWORD:mypassword}      # 配置环境变量
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB
      enabled: true
  cloud:
    nacos:
      serverAddr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
  config:
    import:
      - optional:nacos:nacos-config-example.properties?refreshEnabled=true

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: org.scse.smartcontractsearchengine.handler

file:
  storage:

legacy:
  conversation-ddl:
    enabled: ${LEGACY_CONVERSATION_DDL_ENABLED:true}

contract:
  import:
    token: ${CONTRACT_IMPORT_TOKEN:}
    root: ${CONTRACT_IMPORT_ROOT:}

security:
  jwt:
    secret: ${JWT_SECRET:scse-dev-jwt-secret-2026-local-min-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  address: ${CONTRACT_SERVICE_HOST:127.0.0.1}
  tomcat:
    accept-count: 2000
    max-connections: 2000
    max-swallow-size: 300MB
  port: 18081
