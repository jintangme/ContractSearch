spring:
  application:
    name: cloud-gateway
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: smart-contract-search-engine-api
          uri: ${CONTRACT_SERVICE_GATEWAY_URI:lb://smart-contract-search-engine}
          predicates:
            - Path=/api/**
  config:
    import:
      - optional:nacos:nacos-config-example.properties?refreshEnabled=true

security:
  jwt:
    secret: ${JWT_SECRET:scse-dev-jwt-secret-2026-local-min-32-bytes}

agent:
  route:
    enabled: ${AGENT_ROUTE_ENABLED:false}
    internal-token: ${AGENT_INTERNAL_TOKEN:}
    uri: ${AGENT_SERVICE_GATEWAY_URI:lb://cloud-agent-service}

server:
  port: 18080
