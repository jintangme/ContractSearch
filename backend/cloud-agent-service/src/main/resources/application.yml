spring:
  application:
    name: cloud-agent-service
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
  config:
    import:
      - optional:nacos:nacos-config-example.properties?refreshEnabled=true

server:
  port: ${AGENT_SERVICE_PORT:18082}

agent:
  enabled: ${AGENT_ENABLED:false}
  internal-token: ${AGENT_INTERNAL_TOKEN:}
  model: ${AGENT_MODEL:glm-4.5-air}
  provider:
    base-url: ${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${ZHIPU_API_KEY:}
    timeout-ms: ${AGENT_PROVIDER_TIMEOUT_MS:60000}
    thinking-enabled: ${AGENT_THINKING_ENABLED:false}
  migrations:
    enabled: ${AGENT_MIGRATIONS_ENABLED:false}
    url: ${AGENT_DB_URL:}
    username: ${AGENT_DB_USERNAME:}
    password: ${AGENT_DB_PASSWORD:}
  mini-loop:
    enabled: ${AGENT_MINI_LOOP_ENABLED:false}
    max-steps: ${AGENT_MAX_STEPS:6}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:4}
    max-retrieval-rounds: ${AGENT_MAX_RETRIEVAL_ROUNDS:2}
  dependencies:
    contract-service-base-url: ${AGENT_CONTRACT_SERVICE_URL:http://127.0.0.1:18081}
    runtime-base-url: ${AGENT_RUNTIME_SERVICE_URL:http://127.0.0.1:19090}
    contract-timeout-ms: ${AGENT_CONTRACT_TIMEOUT_MS:15000}
    compile-timeout-ms: ${AGENT_COMPILE_TIMEOUT_MS:45000}
  knowledge:
    enabled: ${AGENT_KNOWLEDGE_ENABLED:false}
    database-url: ${AGENT_KNOWLEDGE_DB_URL:${AGENT_DB_URL:}}
    database-username: ${AGENT_KNOWLEDGE_DB_USERNAME:${AGENT_DB_USERNAME:}}
    database-password: ${AGENT_KNOWLEDGE_DB_PASSWORD:${AGENT_DB_PASSWORD:}}
    corpus-name: ${AGENT_KNOWLEDGE_CORPUS_NAME:contractsearch}
    corpus-version: ${AGENT_KNOWLEDGE_CORPUS_VERSION:phase2-dev}
    max-batch-size: ${AGENT_KNOWLEDGE_MAX_BATCH_SIZE:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    model-profile: ${agent.model}
    agent-enabled: ${agent.enabled}

logging:
  pattern:
    level: "%5p trace_id=%X{traceId:-none}"
