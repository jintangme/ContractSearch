server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://gateway:18080;
        proxy_set_header Host $host;
        proxy_set_header X-User-Id "";
        proxy_set_header X-Agent-Internal-Token "";
        proxy_set_header X-Contract-Import-Token "";
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # This is a loopback-only, single-user demo of a shared in-memory EVM.
    location /runtime-api/ {
        proxy_pass http://runtime:19090/;
        proxy_read_timeout 90s;
    }

    # Lean execution requires separate isolation; never proxy it in this demo.
    location /lean-api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
